    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--text)}body{font-family:'Avenir Next',Avenir,'Segoe UI',sans-serif;padding:48px 24px 80px}main{width:min(100%,1320px);margin:auto}header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:24px}.eyebrow{margin:0 0 8px;font:700 13px Menlo,Monaco,monospace;letter-spacing:.16em;color:var(--accent)}h1{margin:0;font:400 clamp(38px,5vw,52px)/1.06 Georgia,'Times New Roman',serif}.takeaway{max-width:760px;margin:10px 0 0;color:var(--muted);font-size:16px;line-height:1.55}.receipts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:440px}.receipts span{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:color-mix(in srgb,var(--surface) 68%,transparent);font:12px Menlo,Monaco,monospace;color:var(--muted)}.artifact-frame{margin:0;overflow:hidden;border:1px solid var(--border);border-radius:18px;background:var(--canvas);box-shadow:0 20px 60px color-mix(in srgb,var(--text) 10%,transparent)}svg{display:block;width:100%;height:auto;background:var(--canvas)}.label{font:650 18px 'Avenir Next',Avenir,sans-serif;fill:var(--text)}.label.focal-text{fill:var(--accent-text)}.body{font:500 16px 'Avenir Next',Avenir,sans-serif;fill:var(--text)}.micro{font:700 12px Menlo,Monaco,monospace;letter-spacing:.1em;fill:var(--muted)}.node,.zone,.lane,.column,.tier,.tile,.matrix-cell{fill:var(--surface);stroke:var(--connector);stroke-width:2.2}.zone,.column{fill:var(--surface-alt);stroke:var(--border);stroke-width:1.6}.zone.alt,.lane.alt,.tile.alt{fill:var(--canvas)}.zone.dashed{stroke-dasharray:8 7}.node.focal,.tier.focal,.tile.focal{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.8}.node.warning{fill:color-mix(in srgb,var(--danger) 11%,var(--surface));stroke:var(--danger)}.connector,.axis,.leader,.lifeline,.divider,.gridline,.tierline,.bone,.spine{fill:none;stroke:var(--connector);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.axis{stroke-width:2.2}.gridline,.divider,.tierline{stroke:var(--grid);stroke-width:1.4}.leader,.lifeline{stroke-dasharray:9 9}.bridge{fill:none;stroke:var(--canvas);stroke-width:11;stroke-linecap:round}.backedge{stroke-dasharray:10 8}.status,.point,.terminal,.bubble{fill:var(--surface);stroke:var(--connector);stroke-width:3}.point.focal{fill:var(--accent);stroke:var(--on-accent)}.success-fill{fill:var(--success);stroke:none}.danger-fill{fill:var(--danger);stroke:none}.ink-fill{fill:var(--text)}.terminal{fill:none}.accent-band{fill:var(--accent-soft)}.bar,.flowbar{fill:var(--series-1)}.bar.focal,.flowbar.focal{fill:var(--series-2)}.cutline{stroke:var(--danger);stroke-width:3;stroke-dasharray:12 8}.sentiment{stroke:var(--grid);stroke-width:8}.compartment{fill:var(--surface)}.set{fill:color-mix(in srgb,var(--series-1) 24%,transparent);stroke:var(--series-1);stroke-width:3}.set.series-two{fill:color-mix(in srgb,var(--series-2) 24%,transparent);stroke:var(--series-2)}.allow{fill:color-mix(in srgb,var(--success) 22%,var(--surface));stroke:var(--success)}.conditional{fill:var(--accent-soft);stroke:var(--accent)}.deny{fill:color-mix(in srgb,var(--danger) 18%,var(--surface));stroke:var(--danger)}.series-line,.ridge,.gridshape,.radarshape{fill:none;stroke:var(--series-1);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.series-line.second{stroke:var(--series-2)}.series-one-fill{fill:var(--series-1)}.series-two-fill{fill:var(--series-2)}.ridge{stroke-width:7}.gridshape{stroke:var(--grid);stroke-width:2}.radarshape{fill:color-mix(in srgb,var(--series-1) 18%,transparent)}.polar{fill:color-mix(in srgb,var(--series-1) 24%,var(--surface));stroke:var(--series-1);stroke-width:3}.polar.focal{fill:var(--accent-soft);stroke:var(--accent)}.bubble.series-one{fill:var(--series-1)}.bubble.series-two{fill:color-mix(in srgb,var(--series-2) 48%,var(--surface));stroke:var(--series-2)}.funnel{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.3