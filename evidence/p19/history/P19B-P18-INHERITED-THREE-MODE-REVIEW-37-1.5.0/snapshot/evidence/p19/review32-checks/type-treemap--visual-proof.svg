    </style><title id="diagram-type-treemap-neutral-light-title">Tỷ trọng dân số theo châu lục</title><desc id="diagram-type-treemap-neutral-light-desc">Diện tích của sáu ô tỷ lệ trực tiếp với dân số làm tròn trong ảnh tham chiếu; Châu Á là phần lớn nhất và được đánh dấu làm tiêu điểm, Châu Đại Dương quá nhỏ để đặt nhãn đầy đủ trong ô. hierarchical part-to-whole.</desc><defs><pattern id="dot-field" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d9d7d2" opacity=".34"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#4f5e76"/></marker></defs><rect width="2000.0" height="1040.0" fill="#f7f6f2"/><rect width="2000.0" height="1040.0" fill="url(#dot-field)"/><g data-treemap-contract="D-112-thin-complete-borders" data-geometry-contract="D-103-uniform-inset-complete-borders" data-inter-tile-gap="8.0"><rect class="tm-tile tm-focal" data-tile-id="continent-asia" data-value="4780.000000" data-share="0.590123456790" data-label-state="direct" data-allocation-x="80.000000" data-allocation-y="72.000000" data-allocation-width="1085.827160" data-allocation-height="760.000000" data-edge-inset="4.0" data-border-edges="top right bottom left" x="84.000000" y="76.000000" width="1077.827160" height="752.000000" rx="5"/><text class="tm-title" x="114.000" y="130.000" text-anchor="start">Châu Á</text><text class="tm-value" x="114.000" y="172.000" text-anchor="start">4,78 tỷ · 59%</text><rect class="tm-tile tm-level-1" data-tile-id="continent-africa" data-value="1480.000000" data-share="0.182716049383" data-label-state="direct" data-allocation-x="1165.827160" data-allocation-y="72.000000" data-allocation-width="500.527266" data-allocation-height="510.481928" data-edge-inset="4.0" data-border-edges="top right bottom left" x="1169.827160" y="76.000000" width="492.527266" height="502.481928" rx="5"/><text class="tm-title" x="1199.827" y="130