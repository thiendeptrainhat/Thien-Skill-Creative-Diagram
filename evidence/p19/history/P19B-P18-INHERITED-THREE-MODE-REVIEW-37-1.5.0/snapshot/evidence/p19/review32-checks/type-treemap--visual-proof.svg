    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eeece7;color:#252b3c}body{font-family:'Avenir Next',Avenir,'Segoe UI',sans-serif;padding:48px 24px 80px}main{width:min(100%,1320px);margin:auto}header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:24px}.eyebrow{margin:0 0 8px;font:700 13px Menlo,Monaco,monospace;letter-spacing:.16em;color:#f26a32}h1{margin:0;font:400 clamp(38px,5vw,52px)/1.06 Georgia,'Times New Roman',serif}.takeaway{max-width:760px;margin:10px 0 0;color:#687286;font-size:16px;line-height:1.55}.receipts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:440px}.receipts span{padding:7px 10px;border:1px solid #c7ccd2;border-radius:7px;background:color-mix(in srgb,#ffffff 68%,transparent);font:12px Menlo,Monaco,monospace;color:#687286}.artifact-frame{margin:0;overflow:hidden;border:1px solid #c7ccd2;border-radius:18px;background:#f7f6f2;box-shadow:0 20px 60px color-mix(in srgb,#252b3c 10%,transparent)}svg{display:block;width:100%;height:auto;background:#f7f6f2}.label{font:650 18px 'Avenir Next',Avenir,sans-serif;fill:#252b3c}.label.focal-text{fill:#df5522}.body{font:500 16px 'Avenir Next',Avenir,sans-serif;fill:#252b3c}.micro{font:700 12px Menlo,Monaco,monospace;letter-spacing:.1em;fill:#687286}.node,.zone,.lane,.column,.tier,.tile,.matrix-cell{fill:#ffffff;stroke:#4f5e76;stroke-width:2.2}.zone,.column{fill:#eeece7;stroke:#c7ccd2;stroke-width:1.6}.zone.alt,.lane.alt,.tile.alt{fill:#f7f6f2}.zone.dashed{stroke-dasharray:8 7}.node.focal,.tier.focal,.tile.focal{fill:#f8e7dd;stroke:#f26a32;stroke-width:2.8}.node.warning{fill:color-mix(in srgb,var(--danger) 11%,#ffffff);stroke:var(--danger)}.connector,.axis,.leader,.lifeline,.divider,.gridline,.tierline,.bone,.spine{fill:none;stroke:#4f5e76;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.axis{stroke-width:2.2}.gridline,.divider,.tierline{stroke:#d9d7d2;stroke-width:1.4}.leader,.lifeline{stroke-dasharray:9 9}