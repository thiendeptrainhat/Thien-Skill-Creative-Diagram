<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1800 1040" aria-label="Masked silhouette"><style>
    .dp-boundary{fill:color-mix(in srgb,var(--surface-alt) 54%,transparent);stroke:var(--border);stroke-width:1.8}
    .dp-boundary-label-bg,.dp-route-label-bg{fill:var(--canvas)}
    .dp-boundary-label{font:700 13px Menlo,Monaco,monospace;letter-spacing:.17em;fill:var(--muted)}
    .dp-card,.dp-band{fill:var(--surface);stroke:var(--connector);stroke-width:1.9}
    .dp-focal{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.3}.dp-orchestrator{fill:var(--surface-alt);stroke:var(--border)}
    .dp-identity{fill:color-mix(in srgb,var(--accent-soft) 42%,var(--surface));stroke:color-mix(in srgb,var(--accent) 34%,var(--border))}
    .dp-observability{fill:color-mix(in srgb,var(--surface-alt) 70%,var(--surface));stroke:var(--border)}
    .dp-title{font:650 17px 'Avenir Next',Avenir,sans-serif;fill:var(--text)}.dp-detail{font:500 12px Menlo,Monaco,monospace;fill:var(--muted)}
    .dp-icon{fill:none;stroke:var(--connector);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .dp-route{fill:none;stroke-linecap:round;stroke-linejoin:round}.dp-primary{stroke:var(--accent);stroke-width:2.6}.dp-control{stroke:var(--connector);stroke-width:1.8}.dp-service{stroke:var(--accent);stroke-width:2;stroke-dasharray:8 7}
    .dp-route-label{font:700 11px Menlo,Monaco,monospace;letter-spacing:.06em;fill:var(--accent-text)}
    .dp-legend-rule{stroke:var(--grid);stroke-width:1.4}.dp-legend-text{font:500 12px 'Avenir Next',Avenir,sans-serif;fill:var(--muted)}
    .dp-details{overflow-x:auto}.dp-details table{min-width:980px}.dp-details th,.dp-details td:last-child{width:auto}
    
    :root{--paper:#eeece7;--canvas:#f7f6f2;--surface:#ffffff;--surface-alt:#eeece7;--text:#252b3c;--muted:#687286;--border:#c7ccd2;--accent:#f26a32;--accent-soft:#f8e7dd;--accent-text:#df5522;--on-accent:#ffffff;--connector:#4f5e76;--series-1:#2f65af;--series-2:#f26a32;--series-3:#7c9167;--series-4:#b9894b;--grid:#d9d7d2;--success:#7c9167;--danger:#b9473f}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--text)}body{font-family:'Avenir Next',Avenir,'Segoe UI',sans-serif;padding:48px 24px 80px}main{width:min(100%,1320px);margin:auto}header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:24px}.eyebrow{margin:0 0 8px;font:700 13px Menlo,Monaco,monospace;letter-spacing:.16em;color:var(--accent)}h1{margin:0;font:400 clamp(38px,5vw,52px)/1.06 Georgia,'Times New Roman',serif}.takeaway{max-width:760px;margin:10px 0 0;color:var(--muted);font-size:16px;line-height:1.55}.receipts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:440px}.receipts span{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:color-mix(in srgb,var(--surface) 68%,transparent);font:12px Menlo,Monaco,monospace;color:var(--muted)}.artifact-frame{margin:0;overflow:hidden;border:1px solid var(--border);border-radius:18px;background:var(--canvas);box-shadow:0 20px 60px color-mix(in srgb,var(--text) 10%,transparent)}svg{display:block;width:100%;height:auto;background:var(--canvas)}.label{font:650 18px 'Avenir Next',Avenir,sans-serif;fill:var(--text)}.label.focal-text{fill:var(--accent-text)}.body{font:500 16px 'Avenir Next',Avenir,sans-serif;fill:var(--text)}.micro{font:700 12px Menlo,Monaco,monospace;letter-spacing:.1em;fill:var(--muted)}.node,.zone,.lane,.column,.tier,.tile,.matrix-cell{fill:var(--surface);stroke:var(--connector);stroke-width:2.2}.zone,.column{fill:var(--surface-alt);stroke:var(--border);stroke-width:1.6}.zone.alt,.lane.alt,.tile.alt{fill:var(--canvas)}.zone.dashed{stroke-dasharray:8 7}.node.focal,.tier.focal,.tile.focal{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.8}.node.warning{fill:color-mix(in srgb,var(--danger) 11%,var(--surface));stroke:var(--danger)}.connector,.axis,.leader,.lifeline,.divider,.gridline,.tierline,.bone,.spine{fill:none;stroke:var(--connector);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.axis{stroke-width:2.2}.gridline,.divider,.tierline{stroke:var(--grid);stroke-width:1.4}.leader,.lifeline{stroke-dasharray:9 9}.bridge{fill:none;stroke:var(--canvas);stroke-width:11;stroke-linecap:round}.backedge{stroke-dasharray:10 8}.status,.point,.terminal,.bubble{fill:var(--surface);stroke:var(--connector);stroke-width:3}.point.focal{fill:var(--accent);stroke:var(--on-accent)}.success-fill{fill:var(--success);stroke:none}.danger-fill{fill:var(--danger);stroke:none}.ink-fill{fill:var(--text)}.terminal{fill:none}.accent-band{fill:var(--accent-soft)}.bar,.flowbar{fill:var(--series-1)}.bar.focal,.flowbar.focal{fill:var(--series-2)}.cutline{stroke:var(--danger);stroke-width:3;stroke-dasharray:12 8}.sentiment{stroke:var(--grid);stroke-width:8}.compartment{fill:var(--surface)}.set{fill:color-mix(in srgb,var(--series-1) 24%,transparent);stroke:var(--series-1);stroke-width:3}.set.series-two{fill:color-mix(in srgb,var(--series-2) 24%,transparent);stroke:var(--series-2)}.allow{fill:color-mix(in srgb,var(--success) 22%,var(--surface));stroke:var(--success)}.conditional{fill:var(--accent-soft);stroke:var(--accent)}.deny{fill:color-mix(in srgb,var(--danger) 18%,var(--surface));stroke:var(--danger)}.series-line,.ridge,.gridshape,.radarshape{fill:none;stroke:var(--series-1);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.series-line.second{stroke:var(--series-2)}.series-one-fill{fill:var(--series-1)}.series-two-fill{fill:var(--series-2)}.ridge{stroke-width:7}.gridshape{stroke:var(--grid);stroke-width:2}.radarshape{fill:color-mix(in srgb,var(--series-1) 18%,transparent)}.polar{fill:color-mix(in srgb,var(--series-1) 24%,var(--surface));stroke:var(--series-1);stroke-width:3}.polar.focal{fill:var(--accent-soft);stroke:var(--accent)}.bubble.series-one{fill:var(--series-1)}.bubble.series-two{fill:color-mix(in srgb,var(--series-2) 48%,var(--surface));stroke:var(--series-2)}.funnel{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.3}.ribbon{stroke:none;opacity:.46}.ribbon.series-one{fill:var(--grid)}.ribbon.series-two{fill:var(--accent)}.document{fill:var(--surface-alt);stroke:var(--accent);stroke-width:2.8}.visual-signature .legend-rule{stroke:var(--grid);stroke-width:1.5}.visual-signature .legend-swatch{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:24px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--border)}.fact{padding:15px 16px;background:color-mix(in srgb,var(--surface) 72%,transparent)}.fact span{display:block;color:var(--muted);font:700 11px Menlo,Monaco,monospace;letter-spacing:.1em}.fact strong{display:block;margin-top:5px;font-size:14px;overflow-wrap:anywhere}details{margin-top:14px;border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--surface) 72%,transparent)}summary{cursor:pointer;padding:14px 16px;font-weight:650}summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 16px;border-top:1px solid var(--border);text-align:left;vertical-align:top}th{width:18%;color:var(--muted)}td:last-child{width:8%;font-variant-numeric:tabular-nums}@media(max-width:820px){body{padding:24px 12px 48px}header{grid-template-columns:1fr}.receipts{justify-content:flex-start;max-width:none}h1{font-size:40px}.facts{grid-template-columns:1fr}.artifact-frame{overflow:auto}svg{min-width:760px}}@media print{body{padding:0;background:#fff}header,.facts,details{display:none}.artifact-frame{border:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
    </style><defs><pattern id="dot-field" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="var(--grid)" opacity=".34" /></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="var(--connector)" /></marker></defs><rect width="1800" height="1040" fill="var(--canvas)" /><rect width="1800" height="1040" fill="url(#dot-field)" /><g data-dp-group-id="boundary-data-platform"><rect class="dp-boundary" x="390" y="90" width="1020" height="570" rx="18" /><rect class="dp-boundary-label-bg" x="760" y="76" width="280" height="30" /></g><path class="dp-route dp-primary" data-dp-edge-id="flow-crm-store" d="M330 185 H360 V275 H560 V345 H610" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="363" y="152" width="84" height="24" rx="3" /><path class="dp-route dp-primary" data-dp-edge-id="flow-pos-store" d="M330 355 H610" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="363" y="322" width="84" height="24" rx="3" /><path class="dp-route dp-primary" data-dp-edge-id="flow-events-store" d="M330 525 H560 V410 H610" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="363" y="492" width="84" height="24" rx="3" /><path class="dp-route dp-control" data-dp-edge-id="control-orchestrator-store" d="M700 250 V315" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="658" y="267" width="84" height="24" rx="3" /><path class="dp-route dp-control" data-dp-edge-id="control-orchestrator-query" d="M1150 250 V315" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="1108" y="267" width="84" height="24" rx="3" /><path class="dp-route dp-primary" data-dp-edge-id="flow-store-query" d="M890 375 H1010" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="908" y="342" width="84" height="24" rx="3" /><path class="dp-route dp-primary" data-dp-edge-id="flow-query-bi" d="M1290 345 H1425 V185 H1470" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="1333" y="312" width="84" height="24" rx="3" /><path class="dp-route dp-primary" data-dp-edge-id="flow-query-notebook" d="M1290 375 H1470" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="1333" y="342" width="84" height="24" rx="3" /><path class="dp-route dp-primary" data-dp-edge-id="flow-query-partner" d="M1290 405 H1425 V525 H1470" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="1333" y="422" width="84" height="24" rx="3" /><path class="dp-route dp-service" data-dp-edge-id="service-identity-store" d="M760 720 V440" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="688" y="674" width="84" height="24" rx="3" /><path class="dp-route dp-service" data-dp-edge-id="service-identity-query" d="M1160 720 V440" marker-end="url(#arrow)" /><rect class="dp-route-label-bg" x="1148" y="674" width="84" height="24" rx="3" /><g data-dp-node-id="source-crm"><rect class="dp-card dp-external" x="60" y="130" width="270" height="110" rx="10" /><circle class="dp-icon" cx="94" cy="172" r="10" /><path class="dp-icon" d="M84 172v18q10 8 20 0V172" /></g><g data-dp-node-id="source-pos"><rect class="dp-card dp-external" x="60" y="300" width="270" height="110" rx="10" /><circle class="dp-icon" cx="94" cy="342" r="10" /><path class="dp-icon" d="M84 342v18q10 8 20 0V342" /></g><g data-dp-node-id="source-events"><rect class="dp-card dp-external" x="60" y="470" width="270" height="110" rx="10" /><circle class="dp-icon" cx="94" cy="512" r="10" /><path class="dp-icon" d="M84 512v18q10 8 20 0V512" /></g><g data-dp-node-id="platform-orchestrator"><rect class="dp-card dp-orchestrator" x="430" y="160" width="940" height="90" rx="10" /></g><g data-dp-node-id="platform-object-store"><rect class="dp-card dp-focal" x="610" y="315" width="280" height="125" rx="10" /></g><g data-dp-node-id="platform-query"><rect class="dp-card dp-focal" x="1010" y="315" width="280" height="125" rx="10" /></g><g data-dp-node-id="consumer-bi"><rect class="dp-card dp-external" x="1470" y="130" width="270" height="110" rx="10" /><path class="dp-icon" d="M1494 193h24M1498 189V176m8 13V166m8 23V172" /></g><g data-dp-node-id="consumer-notebook"><rect class="dp-card dp-external" x="1470" y="300" width="270" height="110" rx="10" /><path class="dp-icon" d="M1494 363h24M1498 359V346m8 13V336m8 23V342" /></g><g data-dp-node-id="consumer-partner"><rect class="dp-card dp-external" x="1470" y="470" width="270" height="110" rx="10" /><path class="dp-icon" d="M1494 533h24M1498 529V516m8 13V506m8 23V512" /></g><g data-dp-node-id="service-identity"><rect class="dp-band dp-identity" x="60" y="720" width="1680" height="90" rx="10" /><circle class="dp-icon" cx="102" cy="765" r="9" /><path class="dp-icon" d="M111 765h20m-7 0v7m-7-7v5" /></g><g data-dp-node-id="service-observability"><rect class="dp-band dp-observability" x="60" y="840" width="1680" height="90" rx="10" /><path class="dp-icon" d="M84 900h32m-27-6 8-12 7 5 9-17 8 5" /></g><g aria-label="Chú giải DP integration"><line class="dp-legend-rule" x1="60" y1="975" x2="1740" y2="975" /><rect class="dp-card dp-external" x="190" y="990" width="28" height="22" rx="3" /><rect class="dp-card dp-focal" x="470" y="990" width="28" height="22" rx="3" /><rect class="dp-card dp-orchestrator" x="745" y="990" width="28" height="22" rx="3" /><line class="dp-route dp-primary" x1="1010" y1="1001" x2="1060" y2="1001" marker-end="url(#arrow)" /><line class="dp-route dp-service" x1="1335" y1="1001" x2="1385" y2="1001" marker-end="url(#arrow)" /></g></svg>