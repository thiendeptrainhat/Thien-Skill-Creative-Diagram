<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pilot-bar-neutral-light-title pilot-bar-neutral-light-desc" lang="vi">
  <title id="pilot-bar-neutral-light-title">Sự cố theo quý và mức xử lý</title>
  <desc id="pilot-bar-neutral-light-desc">Biểu đồ cột nhóm với dữ liệu tổng hợp. Ưu tiên cao — Quý 1: 12 sự cố, Quý 2: 18 sự cố, Quý 3: 9 sự cố, Quý 4: 16 sự cố; Tiêu chuẩn — Quý 1: 24 sự cố, Quý 2: 20 sự cố, Quý 3: 28 sự cố, Quý 4: 22 sự cố. Trục giá trị bắt đầu từ 0.</desc>
  <style>
    .canvas { fill: #F5F7FA; }
    .surface { fill: #FFFFFF; stroke: #AEBAC9; stroke-width: 2; }
    .surface-alt { fill: #E9EEF4; stroke: #AEBAC9; stroke-width: 1.5; }
    .title { font: 700 32px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #172033; letter-spacing: -0.4px; }
    .eyebrow { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #246BCE; letter-spacing: 1.8px; }
    .heading { font: 700 22px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #172033; }
    .label { font: 600 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #172033; }
    .node-label { font: 650 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #172033; }
    .annotation { font: 500 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #526175; }
    .numeric { font: 700 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #172033; font-variant-numeric: tabular-nums; }
    .route { fill: none; stroke: #405A78; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow); }
    .route-denied { fill: none; stroke: #B23A30; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrow-danger); }
    .route-badge { fill: #FFFFFF; stroke: #AEBAC9; stroke-width: 1; }
    .lane-divider { stroke: #AEBAC9; stroke-width: 1; }
    .grid { stroke: #D5DCE6; stroke-width: 1; }
    </style>
  
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 9 5 L 0 10 z" fill="#405A78"/></marker>
      <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 9 5 L 0 10 z" fill="#B23A30"/></marker>
      <pattern id="series-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#A34F13"/><line x1="0" y1="0" x2="0" y2="8" stroke="#F5F7FA" stroke-width="2" opacity="0.55"/></pattern>
      <pattern id="denied-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B23A30" stroke-width="2" opacity="0.35"/></pattern>
    </defs>
    
  <rect class="canvas" x="0" y="0" width="1440" height="900"/>
  <text x="48.0" y="52.0" class="eyebrow" text-anchor="start" >PILOT • GROUPED BAR • CAP-V05</text><text x="48.0" y="92.0" class="title" text-anchor="start" >Sự cố theo quý và mức xử lý</text><text x="48.0" y="122.0" class="annotation" text-anchor="start" >Dữ liệu tổng hợp nguyên bản • Đơn vị: sự cố • Trục bắt đầu tại 0</text><line class="grid" x1="130.0" y1="736.0" x2="1340.0" y2="736.0"/><text x="112.0" y="741.0" class="annotation" text-anchor="end" >0</text><line class="grid" x1="130.0" y1="646.0" x2="1340.0" y2="646.0"/><text x="112.0" y="651.0" class="annotation" text-anchor="end" >5</text><line class="grid" x1="130.0" y1="556.0" x2="1340.0" y2="556.0"/><text x="112.0" y="561.0" class="annotation" text-anchor="end" >10</text><line class="grid" x1="130.0" y1="466.0" x2="1340.0" y2="466.0"/><text x="112.0" y="471.0" class="annotation" text-anchor="end" >15</text><line class="grid" x1="130.0" y1="376.0" x2="1340.0" y2="376.0"/><text x="112.0" y="381.0" class="annotation" text-anchor="end" >20</text><line class="grid" x1="130.0" y1="286.0" x2="1340.0" y2="286.0"/><text x="112.0" y="291.0" class="annotation" text-anchor="end" >25</text><line class="grid" x1="130.0" y1="196.0" x2="1340.0" y2="196.0"/><text x="112.0" y="201.0" class="annotation" text-anchor="end" >30</text><line x1="130.0" y1="736.0" x2="1340.0" y2="736.0" stroke="#172033" stroke-width="2"/><text x="281.2" y="774.0" class="label" text-anchor="middle" >Quý 1</text><rect id="visual-datum-priority-1" x="206.2" y="520.0" width="66" height="216.0" rx="8" fill="#246BCE"/><text x="239.2" y="510.0" class="numeric" text-anchor="middle" >12</text><rect id="visual-datum-standard-1" x="290.2" y="304.0" width="66" height="432.0" rx="8" fill="url(#series-hatch)"/><text x="323.2" y="294.0" class="numeric" text-anchor="middle" >24</text><text x="583.8" y="774.0" class="label" text-anchor="middle" >Quý 2</text><rect id="visual-datum-priority-2" x="508.8" y="412.0" width="66" height="324.0" rx="8" fill="#246BCE"/><text x="541.8" y="402.0" class="numeric" text-anchor="middle" >18</text><rect id="visual-datum-standard-2" x="592.8" y="376.0" width="66" height="360.0" rx="8" fill="url(#series-hatch)"/><text x="625.8" y="366.0" class="numeric" text-anchor="middle" >20</text><text x="886.2" y="774.0" class="label" text-anchor="middle" >Quý 3</text><rect id="visual-datum-priority-3" x="811.2" y="574.0" width="66" height="162.0" rx="8" fill="#246BCE"/><text x="844.2" y="564.0" class="numeric" text-anchor="middle" >9</text><rect id="visual-datum-standard-3" x="895.2" y="232.0" width="66" height="504.0" rx="8" fill="url(#series-hatch)"/><text x="928.2" y="222.0" class="numeric" text-anchor="middle" >28</text><text x="1188.8" y="774.0" class="label" text-anchor="middle" >Quý 4</text><rect id="visual-datum-priority-4" x="1113.8" y="448.0" width="66" height="288.0" rx="8" fill="#246BCE"/><text x="1146.8" y="438.0" class="numeric" text-anchor="middle" >16</text><rect id="visual-datum-standard-4" x="1197.8" y="340.0" width="66" height="396.0" rx="8" fill="url(#series-hatch)"/><text x="1230.8" y="330.0" class="numeric" text-anchor="middle" >22</text><rect x="130" y="810" width="20" height="20" rx="5" fill="#246BCE"/><text x="162.0" y="825.0" class="label" text-anchor="start" >Ưu tiên cao</text><rect x="350" y="810" width="20" height="20" rx="5" fill="url(#series-hatch)"/><text x="382.0" y="825.0" class="label" text-anchor="start" >Tiêu chuẩn</text>
</svg>
