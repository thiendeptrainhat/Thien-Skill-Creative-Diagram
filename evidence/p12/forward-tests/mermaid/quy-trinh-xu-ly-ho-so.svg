<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="diagram-title diagram-desc" lang="vi" data-static-frame="complete">
  <title id="diagram-title">Nhận hồ sơ</title>
  <desc id="diagram-desc">Nhận hồ sơ dẫn đến quyết định Đủ thông tin. Nếu Có thì Phê duyệt; nếu Không thì Yêu cầu bổ sung.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#35516F"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#152A3D" flood-opacity=".10"/></filter>
  </defs>
  <style>
    .title{font:700 34px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16283A;letter-spacing:-.4px}
    .eyebrow{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#607488;letter-spacing:1.8px}
    .label{font:650 21px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16283A}
    .guard{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16283A}
  </style>
  <rect width="1600" height="900" fill="#F4F7F8"/>
  <path d="M0 0H1600V9H0Z" fill="#2E6D75"/>
  <text class="eyebrow" x="88" y="86">QUY TRÌNH</text>
  <text class="title" x="88" y="132">Nhận hồ sơ</text>
  <path d="M380 410H500" fill="none" stroke="#35516F" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M780 410H870V275H980" fill="none" stroke="#35516F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M640 505V585H980" fill="none" stroke="#35516F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="824" y="308" width="92" height="42" rx="21" fill="#DDEFEA" stroke="#6A928B"/>
  <text class="guard" x="870" y="336" text-anchor="middle">Có</text>
  <rect x="708" y="564" width="105" height="42" rx="21" fill="#F4E7D8" stroke="#B88A5B"/>
  <text class="guard" x="760.5" y="592" text-anchor="middle">Không</text>
  <g filter="url(#shadow)">
    <rect x="110" y="345" width="270" height="130" rx="65" fill="#FFFFFF" stroke="#A7B6C3" stroke-width="2"/>
    <path d="M138 374V446" stroke="#2E6D75" stroke-width="8" stroke-linecap="round"/>
    <text class="label" x="245" y="418" text-anchor="middle">Nhận hồ sơ</text>
  </g>
  <g filter="url(#shadow)">
    <polygon points="640,315 780,410 640,505 500,410" fill="#FFF5D8" stroke="#9A6B17" stroke-width="2.5"/>
    <text class="label" x="640" y="417" text-anchor="middle">Đủ thông tin?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="980" y="210" width="320" height="130" rx="65" fill="#FFFFFF" stroke="#A7B6C3" stroke-width="2"/>
    <path d="M1008 239V311" stroke="#2E6D75" stroke-width="8" stroke-linecap="round"/>
    <text class="label" x="1140" y="283" text-anchor="middle">Phê duyệt</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="980" y="520" width="320" height="130" rx="65" fill="#FFFFFF" stroke="#A7B6C3" stroke-width="2"/>
    <path d="M1008 549V621" stroke="#B77942" stroke-width="8" stroke-linecap="round"/>
    <text class="label" x="1140" y="593" text-anchor="middle">Yêu cầu bổ sung</text>
  </g>
</svg>