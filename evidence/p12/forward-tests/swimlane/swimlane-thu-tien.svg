<title id="diagram-title">Luồng chứng từ thu tiền</title>
<desc id="diagram-desc">Sơ đồ swimlane ngang gồm sáu đơn vị, theo dõi séc, giấy báo chuyển tiền, bảng kê chuyển tiền và hai tệp lưu qua các điểm bàn giao từ một đến năm.</desc>
