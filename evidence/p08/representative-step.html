<!doctype html><html lang="vi" data-motion-mode="step" data-static-frame="complete"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Fixture flowchart</title><style>:root{color-scheme:light dark;--paper:#f4f6fa;--ink:#17223b;--line:#c7d1e2;--focus:#0b65d8}*{box-sizing:border-box}body{margin:0;padding:clamp(12px,3vw,36px);background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans",Arial,"Helvetica Neue",system-ui,sans-serif;line-height:1.45}main{max-width:1800px;margin:auto}figure{position:relative;margin:0;overflow:auto;background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(23,34,59,.12)}svg{display:block;width:100%;height:auto;min-width:640px}.motion-controls{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}button{min-height:44px;padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:white;color:#17223b;font:600 15px inherit}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.motion-status{min-height:1.5em;font-variant-numeric:tabular-nums}.data-alternative{margin-top:20px;overflow:auto}table{border-collapse:collapse;width:100%;background:white}caption{font-weight:700;text-align:left;padding:8px 0}th,td{border:1px solid var(--line);padding:8px;text-align:left}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.motion-target{transition:opacity .22s ease,filter .22s ease,transform .22s ease;transform-box:fill-box;transform-origin:center}
html.motion-enabled[data-motion-mode=step] .motion-target[data-motion-state=future]{opacity:.2;filter:saturate(.25)}
html.motion-enabled[data-motion-mode=step] .motion-target[data-motion-state=past]{opacity:.58}
html.motion-enabled[data-motion-mode=step] .motion-target[data-motion-state=current]{opacity:1;filter:drop-shadow(0 0 7px currentColor);transform:scale(1.025)}
html.motion-enabled[data-motion-mode=reveal] .motion-target{animation:p08-reveal .48s both;animation-delay:calc(var(--motion-index) * 90ms)}
html.motion-enabled[data-motion-mode=loop] figure::after{content:"";position:absolute;inset:10% auto auto 4%;width:12px;height:12px;border-radius:50%;background:#2f6fed;box-shadow:0 0 0 5px rgba(47,111,237,.18);animation:p08-loop 3.2s linear infinite;pointer-events:none}
html.motion-paused *{animation-play-state:paused!important}
@keyframes p08-reveal{from{opacity:.22;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes p08-loop{0%{transform:translate(0,0)}25%{transform:translate(78vw,0)}50%{transform:translate(78vw,60vh)}75%{transform:translate(0,60vh)}100%{transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){.motion-target,figure::after{animation:none!important;transition:none!important;opacity:1!important;filter:none!important;transform:none!important}}
@media print{.motion-controls,.motion-status,noscript{display:none!important}.motion-target{animation:none!important;transition:none!important;opacity:1!important;filter:none!important;transform:none!important}figure{overflow:visible!important;box-shadow:none!important;border:0!important}svg{min-width:0!important;width:100%!important;height:auto!important}}
</style></head><body><main><h1 class="sr-only">Fixture flowchart</h1><nav class="motion-controls" aria-label="Điều khiển chuyển động"><button id="motion-prev" type="button">Bước trước</button><button id="motion-next" type="button">Bước tiếp</button><button id="motion-replay" type="button">Phát lại</button><button id="motion-pause" type="button">Tạm dừng</button></nav><p id="motion-status" class="motion-status" aria-live="polite"></p><figure aria-label="Fixture flowchart"><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="p07-flowchart-neutral-light-title p07-flowchart-neutral-light-desc" lang="vi" data-output-version="p08-output-1" data-static-frame="complete" data-motion-frame="enhanceable">

</svg></figure><noscript>JavaScript không hoạt động; toàn bộ nội dung tĩnh vẫn hiển thị.</noscript></main><script>(()=>{'use strict';const c={"mode":"step","count":7,"pause":"T\u1ea1m d\u1eebng","resume":"Ti\u1ebfp t\u1ee5c"};const root=document.documentElement;const items=[...document.querySelectorAll('[data-motion-index]')];const status=document.getElementById('motion-status');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(c.mode==='none'||reduced||!items.length){if(status)status.textContent='Sơ đồ tĩnh đầy đủ';return;}root.classList.add('motion-enabled');items.forEach((el,i)=>el.style.setProperty('--motion-index',String(i)));let step=0,paused=false;const apply=()=>{if(c.mode!=='step')return;items.forEach((el,i)=>el.dataset.motionState=i<step?'past':i===step?'current':'future');if(status)status.textContent=`${step+1} / ${items.length}`;};const replay=()=>{step=0;root.classList.remove('motion-enabled');void root.offsetWidth;root.classList.add('motion-enabled');apply();};document.getElementById('motion-prev')?.addEventListener('click',()=>{step=Math.max(0,step-1);apply();});document.getElementById('motion-next')?.addEventListener('click',()=>{step=Math.min(items.length-1,step+1);apply();});document.getElementById('motion-replay')?.addEventListener('click',replay);document.getElementById('motion-pause')?.addEventListener('click',e=>{paused=!paused;root.classList.toggle('motion-paused',paused);e.currentTarget.textContent=paused?c.resume:c.pause;});document.addEventListener('keydown',e=>{if(c.mode!=='step'||/input|textarea|select/i.test(e.target.tagName))return;if(e.key==='ArrowRight'){step=Math.min(items.length-1,step+1);apply();}if(e.key==='ArrowLeft'){step=Math.max(0,step-1);apply();}if(e.key==='Home'){step=0;apply();}if(e.key==='End'){step=items.length-1;apply();}});apply();})();</script></body></html>
