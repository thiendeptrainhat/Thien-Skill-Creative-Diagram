<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 960" width="1640" height="960"
      role="img" aria-labelledby="anchor-title anchor-desc" data-layout-engine="special-geometry"
      data-canonical-type="sankey" data-mode="neutral-light" data-semantic-ratio="0.84"
      data-min-label-clearance="8" data-font-measured="true" data-no-global-transform="true"
      data-takeaway-node="focal" data-resolved-human-font="Avenir Next" data-resolved-mono-font="Menlo">
      <title id="anchor-title">Phân bổ CI minutes theo outcome</title>
      <desc id="anchor-desc">Các ribbon bảo toàn tổng 12,000 phút qua stage và outcome; flaked path được nhấn coral.</desc>
      <defs>
        <pattern id="dot-field" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d9d7d2" opacity=".34"/></pattern>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#4f5e76"/></marker>
        <marker id="arrow-accent" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#f26a32"/></marker>
        <style>
      text{font-family:'Avenir Next';fill:#252b3c;text-rendering:geometricPrecision}
      .display{font-family:'Georgia';font-size:48px;font-weight:400}
      .node-title{font-size:24px;font-weight:650}
      .material{font-size:16px;font-weight:500}
      .material-strong{font-size:18px;font-weight:650}
      .mono,.badge-text,.kicker,.legend-note{font-family:'Menlo';font-size:16px}
      .mono{fill:#53627b}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2.1px;fill:#778194}
      .badge-text{font-size:14px;font-weight:700;letter-spacing:1px;fill:#53627b}
      .node-boundary{fill:#ffffff;stroke:#4f5e76;stroke-width:2.2}
      .node-card.focal .node-boundary{fill:#f8e7dd;stroke:#f26a32;stroke-width:2.8}
      .node-card.muted .node-boundary{fill:#eeece7;stroke:#c7ccd2}
      .badge{fill:#eeece7;stroke:#c7ccd2;stroke-width:1.2}
      .focal .badge{fill:#fff3ec;stroke:#f26a32}
      .focal .badge-text{fill:#df5522}
      .wire{fill:none;stroke:#4f5e76;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .wire.soft{stroke:#c7ccd2;stroke-width:2}
      .wire.accent{stroke:#f26a32;stroke-width:3.6}
      .wire.blue{stroke:#2f65af}
      .wire.green{stroke:#7c9167}
      .wire.dashed{stroke-dasharray:9 9}
      .bridge-hop-underlay{fill:none;stroke:#f7f6f2;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
      .bridge-hop{fill:none;stroke:#4f5e76;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .zone{fill:none;stroke:#c7ccd2;stroke-width:1.6}
      .zone-fill{fill:#eeece7;fill-opacity:.55;stroke:#c7ccd2;stroke-width:1.6}
      .grid{stroke:#d9d7d2;stroke-width:1.4}
      .dot{fill:#252b3c}
      .accent-dot{fill:#f26a32}
      .legend-rule{stroke:#d9d7d2;stroke-width:1.5}
      .legend-accent{fill:#f8e7dd;stroke:#f26a32;stroke-width:2}
      .legend-text{font-size:16px;fill:#53627b}
      .legend-note{font-size:14px;font-style:italic;fill:#53627b}
      .band{fill:#e8ebee;stroke:#c7ccd2;stroke-width:1.5}
      .band.focal{fill:#f8e7dd;stroke:#f26a32;stroke-width:2.3}
      .pyramid-layer-fill{fill:#e8ebee;stroke:none}
      .pyramid-layer-fill.focal{fill:#f8e7dd}
      .pyramid-outer-outline,.pyramid-divider{fill:none;stroke:#c7ccd2;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .pyramid-apex-outline,.pyramid-divider.focal{fill:none;stroke:#f26a32;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
      .pyramid-annotation{font-family:'Menlo';font-size:16px;font-weight:650;letter-spacing:1px;fill:#778194}
      .pyramid-annotation.accent{fill:#df5522}
      .label-mask{fill:#f7f6f2}
      .axis{stroke:#4f5e76;stroke-width:2.2}
    </style>
      </defs>
      <rect width="1640" height="960" fill="#f7f6f2"/>
      <rect width="1640" height="960" fill="url(#dot-field)"/>
      <path d="M132 250 C330 250 510 220 720 220 L720 390 C510 390 330 400 132 400 Z" fill="#c7ccd2" fill-opacity="0.74" stroke="none"/><path d="M132 410 C360 410 520 470 720 470 L720 610 C520 610 360 560 132 560 Z" fill="#c7ccd2" fill-opacity="0.74" stroke="none"/><path d="M132 570 C350 570 540 700 720 700 L720 790 C540 790 350 680 132 680 Z" fill="#c7ccd2" fill-opacity="0.74" stroke="none"/><path d="M750 200 C980 200 1190 210 1420 230 L1420 480 C1180 440 980 370 750 360 Z" fill="#c7ccd2" fill-opacity="0.72" stroke="none"/><path d="M750 470 C980 470 1190 470 1420 470 L1420 610 C1190 610 980 610 750 610 Z" fill="#c7ccd2" fill-opacity="0.72" stroke="none"/><path d="M750 700 C980 700 1190 540 1420 520 L1420 610 C1190 640 980 760 750 780 Z" fill="#c7ccd2" fill-opacity="0.72" stroke="none"/><path d="M750 360 C980 360 1190 800 1420 790 L1420 842 C1190 850 980 440 750 390 Z" fill="#f26a32" fill-opacity="0.32" stroke="none"/><text class="kicker" x="84.0" y="120.0" text-anchor="start">INTAKE</text><text class="kicker" x="710.0" y="120.0" text-anchor="start">ROUTING</text><text class="kicker" x="1400.0" y="120.0" text-anchor="start">OUTCOME</text><rect x="90" y="210" width="42" height="300" fill="#252b3c" rx="4"/><text class="node-title" x="148.0" y="354.0" text-anchor="start">Monthly budget</text><text class="mono" x="148.0" y="384.0" text-anchor="start">12,000 min</text><rect x="720" y="170" width="30" height="220" fill="#252b3c" rx="4"/><text class="node-title" x="766.0" y="274.0" text-anchor="start">Unit tests</text><text class="mono" x="766.0" y="304.0" text-anchor="start">5,200 min</text><rect x="720" y="430" width="30" height="190" fill="#252b3c" rx="4"/><text class="node-title" x="766.0" y="519.0" text-anchor="start">E2E</text><text class="mono" x="766.0" y="549.0" text-anchor="start">4,000 min</text><rect x="720" y="670" width="30" height="120" fill="#252b3c" rx="4"/><text class="node-title" x="766.0" y="724.0" text-anchor="start">Build + lint</text><text class="mono" x="766.0" y="754.0" text-anchor="start">2,800 min</text><rect x="1420" y="190" width="30" height="340" fill="#252b3c" rx="4"/><text class="node-title" x="1404.0" y="354.0" text-anchor="end">Passed</text><text class="mono" x="1404.0" y="384.0" text-anchor="end">9,400 min</text><rect x="1420" y="590" width="30" height="130" fill="#252b3c" rx="4"/><text class="node-title" x="1404.0" y="649.0" text-anchor="end">Failed</text><text class="mono" x="1404.0" y="679.0" text-anchor="end">1,600 min</text><rect x="1420" y="770" width="30" height="72" fill="#f26a32" rx="4"/><text class="node-title" x="1404.0" y="800.0" text-anchor="end">Flaked</text><text class="mono" x="1404.0" y="830.0" text-anchor="end">1,000 min</text><line class="legend-rule" x1="52" y1="860" x2="1588" y2="860"/><text class="kicker" x="56.0" y="898.0" text-anchor="start">LEGEND</text><line class="wire" x1="210.0" y1="894" x2="252.0" y2="894"/><text class="legend-text" x="268.0" y="899.0" text-anchor="start">stage routing</text><rect class="legend-accent" x="425.0" y="880" width="28" height="24" rx="5"/><text class="legend-text" x="467.0" y="899.0" text-anchor="start">flaked rerun</text><circle class="dot" cx="645.0" cy="892" r="8"/><text class="legend-text" x="673.0" y="899.0" text-anchor="start">stage total</text><text class="legend-note" x="1584.0" y="899.0" text-anchor="end">Ribbon width is proportional; totals reconcile to 12,000 minutes.</text>
    </svg>