<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" width="1500" height="980"
      role="img" aria-labelledby="anchor-title anchor-desc" data-layout-engine="quantitative"
      data-canonical-type="scatter-plot" data-mode="neutral-light" data-semantic-ratio="0.83"
      data-min-label-clearance="8" data-font-measured="true" data-no-global-transform="true"
      data-takeaway-node="focal" data-resolved-human-font="Avenir Next" data-resolved-mono-font="Menlo">
      <title id="anchor-title">Tự động hóa, kiểm soát và khối lượng</title>
      <desc id="anchor-desc">Năm phương án trên hai trục; diện tích bubble mã hóa volume và Hybrid là focal recommendation.</desc>
      <defs>
        <pattern id="dot-field" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d9d7d2" opacity=".34"/></pattern>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#4f5e76"/></marker>
        <marker id="arrow-accent" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#f26a32"/></marker>
        <style>
      text{font-family:'Avenir Next';fill:#252b3c;text-rendering:geometricPrecision}
      .display{font-family:'Georgia';font-size:48px;font-weight:400}
      .node-title{font-size:24px;font-weight:650}
      .material{font-size:16px;font-weight:500}
      .material-strong{font-size:18px;font-weight:650}
      .mono,.badge-text,.kicker,.legend-note{font-family:'Menlo';font-size:16px}
      .mono{fill:#53627b}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2.1px;fill:#778194}
      .badge-text{font-size:14px;font-weight:700;letter-spacing:1px;fill:#53627b}
      .node-boundary{fill:#ffffff;stroke:#4f5e76;stroke-width:2.2}
      .node-card.focal .node-boundary{fill:#f8e7dd;stroke:#f26a32;stroke-width:2.8}
      .node-card.muted .node-boundary{fill:#eeece7;stroke:#c7ccd2}
      .badge{fill:#eeece7;stroke:#c7ccd2;stroke-width:1.2}
      .focal .badge{fill:#fff3ec;stroke:#f26a32}
      .focal .badge-text{fill:#df5522}
      .wire{fill:none;stroke:#4f5e76;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .wire.soft{stroke:#c7ccd2;stroke-width:2}
      .wire.accent{stroke:#f26a32;stroke-width:3.6}
      .wire.blue{stroke:#2f65af}
      .wire.green{stroke:#7c9167}
      .wire.dashed{stroke-dasharray:9 9}
      .bridge-hop-underlay{fill:none;stroke:#f7f6f2;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
      .bridge-hop{fill:none;stroke:#4f5e76;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .zone{fill:none;stroke:#c7ccd2;stroke-width:1.6}
      .zone-fill{fill:#eeece7;fill-opacity:.55;stroke:#c7ccd2;stroke-width:1.6}
      .grid{stroke:#d9d7d2;stroke-width:1.4}
      .dot{fill:#252b3c}
      .accent-dot{fill:#f26a32}
      .legend-rule{stroke:#d9d7d2;stroke-width:1.5}
      .legend-accent{fill:#f8e7dd;stroke:#f26a32;stroke-width:2}
      .legend-text{font-size:16px;fill:#53627b}
      .legend-note{font-size:14px;font-style:italic;fill:#53627b}
      .band{fill:#e8ebee;stroke:#c7ccd2;stroke-width:1.5}
      .band.focal{fill:#f8e7dd;stroke:#f26a32;stroke-width:2.3}
      .pyramid-layer-fill{fill:#e8ebee;stroke:none}
      .pyramid-layer-fill.focal{fill:#f8e7dd}
      .pyramid-outer-outline,.pyramid-divider{fill:none;stroke:#c7ccd2;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .pyramid-apex-outline,.pyramid-divider.focal{fill:none;stroke:#f26a32;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
      .pyramid-annotation{font-family:'Menlo';font-size:16px;font-weight:650;letter-spacing:1px;fill:#778194}
      .pyramid-annotation.accent{fill:#df5522}
      .label-mask{fill:#f7f6f2}
      .axis{stroke:#4f5e76;stroke-width:2.2}
    </style>
      </defs>
      <rect width="1500" height="980" fill="#f7f6f2"/>
      <rect width="1500" height="980" fill="url(#dot-field)"/>
      <line class="axis" x1="170" y1="740" x2="1370" y2="740"/><line class="axis" x1="170" y1="110" x2="170" y2="740" marker-end="url(#arrow)"/><line class="grid" x1="170" y1="740.0" x2="1370" y2="740.0"/><text class="mono" x="144.0" y="746.0" text-anchor="end">0</text><line class="grid" x1="170" y1="628.0" x2="1370" y2="628.0"/><text class="mono" x="144.0" y="634.0" text-anchor="end">20</text><line class="grid" x1="170" y1="516.0" x2="1370" y2="516.0"/><text class="mono" x="144.0" y="522.0" text-anchor="end">40</text><line class="grid" x1="170" y1="404.0" x2="1370" y2="404.0"/><text class="mono" x="144.0" y="410.0" text-anchor="end">60</text><line class="grid" x1="170" y1="292.0" x2="1370" y2="292.0"/><text class="mono" x="144.0" y="298.0" text-anchor="end">80</text><line class="grid" x1="170" y1="180.0" x2="1370" y2="180.0"/><text class="mono" x="144.0" y="186.0" text-anchor="end">100</text><line class="axis" x1="170.0" y1="740" x2="170.0" y2="750"/><text class="mono" x="170.0" y="782.0" text-anchor="middle">0</text><line class="axis" x1="400.0" y1="740" x2="400.0" y2="750"/><text class="mono" x="400.0" y="782.0" text-anchor="middle">20</text><line class="axis" x1="630.0" y1="740" x2="630.0" y2="750"/><text class="mono" x="630.0" y="782.0" text-anchor="middle">40</text><line class="axis" x1="860.0" y1="740" x2="860.0" y2="750"/><text class="mono" x="860.0" y="782.0" text-anchor="middle">60</text><line class="axis" x1="1090.0" y1="740" x2="1090.0" y2="750"/><text class="mono" x="1090.0" y="782.0" text-anchor="middle">80</text><line class="axis" x1="1320.0" y1="740" x2="1320.0" y2="750"/><text class="mono" x="1320.0" y="782.0" text-anchor="middle">100</text><circle cx="446.0" cy="336.8" r="22.1" fill="#252b3c" fill-opacity=".24" stroke="#252b3c" stroke-width="2" data-x="24" data-y="72" data-size="18"/><text class="material" x="480.1" y="342.8" text-anchor="start">Manual review</text><circle cx="653.0" cy="415.2" r="29.4" fill="#252b3c" fill-opacity=".24" stroke="#252b3c" stroke-width="2" data-x="42" data-y="58" data-size="32"/><text class="material" x="694.4" y="421.2" text-anchor="start">Rules engine</text><circle cx="883.0" cy="303.2" r="35.3" fill="#f26a32" fill-opacity=".80" stroke="#f26a32" stroke-width="2" data-x="62" data-y="78" data-size="46"/><text class="material" x="930.3" y="309.2" text-anchor="start">Hybrid</text><circle cx="1067.0" cy="448.8" r="25.5" fill="#252b3c" fill-opacity=".24" stroke="#252b3c" stroke-width="2" data-x="78" data-y="52" data-size="24"/><text class="material" x="1104.5" y="454.8" text-anchor="start">Auto-approve</text><circle cx="1182.0" cy="560.8" r="19.5" fill="#252b3c" fill-opacity=".24" stroke="#252b3c" stroke-width="2" data-x="88" data-y="32" data-size="14"/><text class="material" x="1213.5" y="566.8" text-anchor="start">Fast path</text><text class="kicker" x="770.0" y="838.0" text-anchor="middle">AUTOMATION %</text><text class="kicker" x="62.0" y="425.0" text-anchor="middle" transform="rotate(-90 62 425.0)">CONTROL CONFIDENCE</text><line class="legend-rule" x1="52" y1="878" x2="1448" y2="878"/><text class="kicker" x="56.0" y="916.0" text-anchor="start">LEGEND</text><rect class="legend-accent" x="210.0" y="898" width="28" height="24" rx="5"/><text class="legend-text" x="252.0" y="917.0" text-anchor="start">recommended</text><circle class="dot" cx="450.0" cy="910" r="8"/><text class="legend-text" x="478.0" y="917.0" text-anchor="start">alternative</text><text class="legend-note" x="1444.0" y="917.0" text-anchor="end">Bubble area encodes monthly volume; exact values are in the accessible table.</text>
    </svg>