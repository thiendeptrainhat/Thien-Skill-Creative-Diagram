xt></g><g class="time-event bottom-event" data-label-position="below-leader"><circle class="accent-dot" cx="1518" cy="410" r="11"/><line class="wire accent" x1="1518" y1="410" x2="1518" y2="548"/><text class="kicker" x="1518.0" y="586.0" text-anchor="middle">APR 2026</text><text class="node-title" x="1518.0" y="626.0" text-anchor="middle">Coverage</text><text class="mono" x="1518.0" y="658.0" text-anchor="middle">39 + 4</text></g><line class="legend-rule" x1="52" y1="738" x2="1628" y2="738"/><text class="kicker" x="56.0" y="776.0" text-anchor="start">LEGEND</text><circle class="dot" cx="224.0" cy="770" r="8"/><text class="legend-text" x="252.0" y="777.0" text-anchor="start">event</text><rect class="legend-accent" x="415.0" y="758" width="28" height="24" rx="5"/><text class="legend-text" x="457.0" y="777.0" text-anchor="start">major milestone</text><text class="legend-note" x="1624.0" y="777.0" text-anchor="end">Spacing is proportional to elapsed time.</text>
