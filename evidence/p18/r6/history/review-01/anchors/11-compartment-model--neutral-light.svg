<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 940" width="1640" height="940"
      role="img" aria-labelledby="anchor-title anchor-desc" data-layout-engine="compartment-model"
      data-canonical-type="database-schema" data-mode="neutral-light" data-semantic-ratio="0.84"
      data-min-label-clearance="8" data-font-measured="true" data-no-global-transform="true"
      data-takeaway-node="focal" data-resolved-human-font="Avenir Next" data-resolved-mono-font="Menlo">
      <title id="anchor-title">Mô hình đơn hàng và thanh toán</title>
      <desc id="anchor-desc">Bốn entity compartment với primary key, foreign key và cardinality rõ ràng.</desc>
      <defs>
        <pattern id="dot-field" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d9d7d2" opacity=".34"/></pattern>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#4f5e76"/></marker>
        <marker id="arrow-accent" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#f26a32"/></marker>
        <style>
      text{font-family:'Avenir Next';fill:#252b3c;text-rendering:geometricPrecision}
      .display{font-family:'Georgia';font-size:48px;font-weight:400}
      .node-title{font-size:24px;font-weight:650}
      .material{font-size:16px;font-weight:500}
      .material-strong{font-size:18px;font-weight:650}
      .mono,.badge-text,.kicker,.legend-note{font-family:'Menlo';font-size:16px}
      .mono{fill:#53627b}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2.1px;fill:#778194}
      .badge-text{font-size:14px;font-weight:700;letter-spacing:1px;fill:#53627b}
      .node-boundary{fill:#ffffff;stroke:#4f5e76;stroke-width:2.2}
      .node-card.focal .node-boundary{fill:#f8e7dd;stroke:#f26a32;stroke-width:2.8}
      .node-card.muted .node-boundary{fill:#eeece7;stroke:#c7ccd2}
      .badge{fill:#eeece7;stroke:#c7ccd2;stroke-width:1.2}
      .focal .badge{fill:#fff3ec;stroke:#f26a32}
      .focal .badge-text{fill:#df5522}
      .wire{fill:none;stroke:#4f5e76;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .wire.soft{stroke:#c7ccd2;stroke-width:2}
      .wire.accent{stroke:#f26a32;stroke-width:3.6}
      .wire.blue{stroke:#2f65af}
      .wire.green{stroke:#7c9167}
      .wire.dashed{stroke-dasharray:9 9}
      .zone{fill:none;stroke:#c7ccd2;stroke-width:1.6}
      .zone-fill{fill:#eeece7;fill-opacity:.55;stroke:#c7ccd2;stroke-width:1.6}
      .grid{stroke:#d9d7d2;stroke-width:1.4}
      .dot{fill:#252b3c}
      .accent-dot{fill:#f26a32}
      .legend-rule{stroke:#d9d7d2;stroke-width:1.5}
      .legend-accent{fill:#f8e7dd;stroke:#f26a32;stroke-width:2}
      .legend-text{font-size:16px;fill:#53627b}
      .legend-note{font-size:14px;font-style:italic;fill:#53627b}
      .band{fill:#e8ebee;stroke:#c7ccd2;stroke-width:1.5}
      .band.focal{fill:#f8e7dd;stroke:#f26a32;stroke-width:2.3}
      .label-mask{fill:#f7f6f2}
      .axis{stroke:#4f5e76;stroke-width:2.2}
    </style>
      </defs>
      <rect width="1640" height="940" fill="#f7f6f2"/>
      <rect width="1640" height="940" fill="url(#dot-field)"/>
      <g class="node-card"><rect class="node-boundary" x="70" y="200" width="390" height="244" rx="14"/><text class="kicker" x="94.0" y="234.0" text-anchor="start">ENTITY</text><text class="node-title" x="94.0" y="270.0" text-anchor="start">CUSTOMER</text><line class="grid" x1="70" y1="286" x2="460" y2="286"/><text class="mono" x="94.0" y="324.0" text-anchor="start"># id          uuid</text><text class="mono" x="94.0" y="362.0" text-anchor="start">email         text · unique</text><text class="mono" x="94.0" y="400.0" text-anchor="start">segment       enum</text><text class="mono" x="94.0" y="438.0" text-anchor="start">created_at    timestamp</text></g><g class="node-card focal"><rect class="node-boundary" x="620" y="128" width="430" height="282" rx="14"/><text class="kicker" x="644.0" y="162.0" text-anchor="start">ENTITY</text><text class="node-title" x="644.0" y="198.0" text-anchor="start">ORDER</text><line class="grid" x1="620" y1="214" x2="1050" y2="214"/><text class="mono" x="644.0" y="252.0" text-anchor="start"># id          uuid</text><text class="mono" x="644.0" y="290.0" text-anchor="start">→ customer_id uuid</text><text class="mono" x="644.0" y="328.0" text-anchor="start">status        enum</text><text class="mono" x="644.0" y="366.0" text-anchor="start">total         decimal</text><text class="mono" x="644.0" y="404.0" text-anchor="start">placed_at     timestamp</text></g><g class="node-card"><rect class="node-boundary" x="1180" y="200" width="390" height="282" rx="14"/><text class="kicker" x="1204.0" y="234.0" text-anchor="start">ENTITY</text><text class="node-title" x="1204.0" y="270.0" text-anchor="start">PAYMENT</text><line class="grid" x1="1180" y1="286" x2="1570" y2="286"/><text class="mono" x="1204.0" y="324.0" text-anchor="start"># id          uuid</text><text class="mono" x="1204.0" y="362.0" text-anchor="start">→ order_id    uuid</text><text class="mono" x="1204.0" y="400.0" text-anchor="start">provider      text</text><text class="mono" x="1204.0" y="438.0" text-anchor="start">amount        decimal</text><text class="mono" x="1204.0" y="476.0" text-anchor="start">captured_at   timestamp</text></g><g class="node-card muted"><rect class="node-boundary" x="640" y="548" width="390" height="244" rx="14"/><text class="kicker" x="664.0" y="582.0" text-anchor="start">ENTITY</text><text class="node-title" x="664.0" y="618.0" text-anchor="start">ORDER_ITEM</text><line class="grid" x1="640" y1="634" x2="1030" y2="634"/><text class="mono" x="664.0" y="672.0" text-anchor="start">→ order_id    uuid</text><text class="mono" x="664.0" y="710.0" text-anchor="start">→ sku_id      uuid</text><text class="mono" x="664.0" y="748.0" text-anchor="start">quantity      int</text><text class="mono" x="664.0" y="786.0" text-anchor="start">unit_price    decimal</text></g><path class="wire" d="M460 342 H570 Q620 342 620 300"/><text class="kicker" x="538.0" y="323.0" text-anchor="middle">1 · PLACES · N</text><path class="wire" d="M1050 300 Q1100 300 1180 342"/><text class="kicker" x="1118.0" y="276.0" text-anchor="middle">1 · PAID BY · N</text><path class="wire" d="M835 410 V548"/><text class="kicker" x="856.0" y="500.0" text-anchor="start">1 · CONTAINS · N</text><line class="legend-rule" x1="52" y1="828" x2="1588" y2="828"/><text class="kicker" x="56.0" y="866.0" text-anchor="start">LEGEND</text><rect class="legend-accent" x="210.0" y="848" width="28" height="24" rx="5"/><text class="legend-text" x="252.0" y="867.0" text-anchor="start">aggregate root</text><line class="wire" x1="441.0" y1="862" x2="483.0" y2="862"/><text class="legend-text" x="499.0" y="867.0" text-anchor="start">relationship</text><line class="wire dashed" x1="646.0" y1="862" x2="688.0" y2="862"/><text class="legend-text" x="704.0" y="867.0" text-anchor="start">join / dependent</text><text class="legend-note" x="1584.0" y="867.0" text-anchor="end"># primary key · → foreign key · 1/N cardinality</text>
    </svg>