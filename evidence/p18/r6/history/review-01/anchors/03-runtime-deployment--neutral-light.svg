y="324.0" text-anchor="middle">DB</text><text class="node-title" x="1236.0" y="364.0" text-anchor="middle">Postgres</text><text class="mono" x="1236.0" y="393.0" text-anchor="middle">multi-AZ</text></g><g class="node-card muted" data-measured-title-width="166.00" data-card-width="312.00"><rect class="node-boundary" x="1080" y="486" width="312" height="124" rx="14"/><rect class="badge" x="1098" y="502" width="54" height="28" rx="6"/><text class="badge-text" x="1125.0" y="522.0" text-anchor="middle">OBJ</text><text class="node-title" x="1236.0" y="562.0" text-anchor="middle">Object storage</text><text class="mono" x="1236.0" y="591.0" text-anchor="middle">encrypted</text></g><path class="wire" d="M494 396 H608" marker-end="url(#arrow)"/><path class="wire accent" d="M918 380 H1000 Q1040 380 1080 350" marker-end="url(#arrow-accent)"/><path class="wire" d="M918 426 H1000 Q1040 426 1080 548" marker-end="url(#arrow)"/><text class="kicker" x="550.0" y="378.0" text-anchor="middle">JOBS</text><text class="kicker" x="1004.0" y="354.0" text-anchor="middle">SQL</text><line class="legend-rule" x1="52" y1="824" x2="1488" y2="824"/><text class="kicker" x="56.0" y="862.0" text-anchor="start">LEGEND</text><rect class="legend-accent" x="210.0" y="844" width="28" height="24" rx="5"/><text class="legend-text" x="252.0" y="863.0" text-anchor="start">public workload</text><line class="wire" x1="446.0" y1="858" x2="488.0" y2="858"/><text class="legend-text" x="504.0" y="863.0" text-anchor="start">runtime dependency</text><line class="wire dashed" x1="715.0" y1="858" x2="757.0" y2="858"/><text class="legend-text" x="773.0" y="863.0" text-anchor="start">external boundary</text><text class="legend-note" x="1484.0" y="863.0" text-anchor="end">Containment is the deployment truth.</text>
