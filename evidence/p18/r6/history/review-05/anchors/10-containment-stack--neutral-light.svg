<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1000" width="1420" height="1000"
      role="img" aria-labelledby="anchor-title anchor-desc" data-layout-engine="containment-stack"
      data-canonical-type="pyramid-funnel" data-mode="neutral-light" data-semantic-ratio="0.89"
      data-min-label-clearance="8" data-font-measured="true" data-no-global-transform="true"
      data-takeaway-node="focal" data-resolved-human-font="Avenir Next" data-resolved-mono-font="Menlo">
      <title id="anchor-title">Tháp vận hành từ thủ tục đến quyết định</title>
      <desc id="anchor-desc">Bốn lớp thu hẹp theo độ hiếm và đòn bẩy; apex là focal layer.</desc>
      <defs>
        <pattern id="dot-field" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d9d7d2" opacity=".34"/></pattern>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#4f5e76"/></marker>
        <marker id="arrow-accent" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#f26a32"/></marker>
        <style>
      text{font-family:'Avenir Next';fill:#252b3c;text-rendering:geometricPrecision}
      .display{font-family:'Georgia';font-size:48px;font-weight:400}
      .node-title{font-size:24px;font-weight:650}
      .material{font-size:16px;font-weight:500}
      .material-strong{font-size:18px;font-weight:650}
      .mono,.badge-text,.kicker,.legend-note{font-family:'Menlo';font-size:16px}
      .mono{fill:#53627b}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2.1px;fill:#778194}
      .badge-text{font-size:14px;font-weight:700;letter-spacing:1px;fill:#53627b}
      .node-boundary{fill:#ffffff;stroke:#4f5e76;stroke-width:2.2}
      .node-card.focal .node-boundary{fill:#f8e7dd;stroke:#f26a32;stroke-width:2.8}
      .node-card.muted .node-boundary{fill:#eeece7;stroke:#c7ccd2}
      .badge{fill:#eeece7;stroke:#c7ccd2;stroke-width:1.2}
      .focal .badge{fill:#fff3ec;stroke:#f26a32}
      .focal .badge-text{fill:#df5522}
      .wire{fill:none;stroke:#4f5e76;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .wire.soft{stroke:#c7ccd2;stroke-width:2}
      .wire.accent{stroke:#f26a32;stroke-width:3.6}
      .wire.blue{stroke:#2f65af}
      .wire.green{stroke:#7c9167}
      .wire.dashed{stroke-dasharray:9 9}
      .bridge-hop-underlay{fill:none;stroke:#f7f6f2;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
      .bridge-hop{fill:none;stroke:#4f5e76;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .zone{fill:none;stroke:#c7ccd2;stroke-width:1.6}
      .zone-fill{fill:#eeece7;fill-opacity:.55;stroke:#c7ccd2;stroke-width:1.6}
      .grid{stroke:#d9d7d2;stroke-width:1.4}
      .dot{fill:#252b3c}
      .accent-dot{fill:#f26a32}
      .legend-rule{stroke:#d9d7d2;stroke-width:1.5}
      .legend-accent{fill:#f8e7dd;stroke:#f26a32;stroke-width:2}
      .legend-text{font-size:16px;fill:#53627b}
      .legend-note{font-size:14px;font-style:italic;fill:#53627b}
      .band{fill:#e8ebee;stroke:#c7ccd2;stroke-width:1.5}
      .band.focal{fill:#f8e7dd;stroke:#f26a32;stroke-width:2.3}
      .pyramid-layer-fill{fill:#e8ebee;stroke:none}
      .pyramid-layer-fill.focal{fill:#f8e7dd}
      .pyramid-outer-outline,.pyramid-divider{fill:none;stroke:#c7ccd2;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .pyramid-apex-outline,.pyramid-divider.focal{fill:none;stroke:#f26a32;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
      .label-mask{fill:#f7f6f2}
      .axis{stroke:#4f5e76;stroke-width:2.2}
    </style>
      </defs>
      <rect width="1420" height="1000" fill="#f7f6f2"/>
      <rect width="1420" height="1000" fill="url(#dot-field)"/>
      <g class="pyramid-stack" data-pyramid-silhouette="continuous-triangle" data-remediation="D-063" data-apex-x="750.00" data-apex-y="112.00" data-base-left-x="250.00" data-base-right-x="1250.00" data-base-y="750.00" data-axis-x="90.00" data-min-axis-clearance="140.00" data-actual-axis-clearance="160.00" data-layer-count="4" data-shared-boundary-count="3" data-shared-boundary-rendering="single-stroke"><polygon class="pyramid-layer-fill focal" points="750.00,112.00 905.17,310.00 594.83,310.00" data-pyramid-layer="0" data-layer-shape="triangle" data-top-y="112.00" data-bottom-y="310.00"/><polygon class="pyramid-layer-fill" points="594.83,310.00 905.17,310.00 1022.73,460.00 477.27,460.00" data-pyramid-layer="1" data-layer-shape="trapezoid" data-top-y="310.00" data-bottom-y="460.00"/><polygon class="pyramid-layer-fill" points="477.27,460.00 1022.73,460.00 1140.28,610.00 359.72,610.00" data-pyramid-layer="2" data-layer-shape="trapezoid" data-top-y="460.00" data-bottom-y="610.00"/><polygon class="pyramid-layer-fill" points="359.72,610.00 1140.28,610.00 1250.00,750.00 250.00,750.00" data-pyramid-layer="3" data-layer-shape="trapezoid" data-top-y="610.00" data-bottom-y="750.00"/><path class="pyramid-outer-outline" d="M 750.00 112.00 L 1250.00 750.00 L 250.00 750.00 Z" data-role="outer-triangle-outline"/><path class="pyramid-apex-outline" d="M 594.83 310.00 L 750.00 112.00 L 905.17 310.00" data-role="apex-two-side-outline"/><line class="pyramid-divider focal" x1="594.83" y1="310.0" x2="905.17" y2="310.0" data-shared-boundary-index="0" data-boundary-render-count="1" data-adjacent-layers="0 1"/><line class="pyramid-divider" x1="477.27" y1="460.0" x2="1022.73" y2="460.0" data-shared-boundary-index="1" data-boundary-render-count="1" data-adjacent-layers="1 2"/><line class="pyramid-divider" x1="359.72" y1="610.0" x2="1140.28" y2="610.0" data-shared-boundary-index="2" data-boundary-render-count="1" data-adjacent-layers="2 3"/><text class="node-title" x="750.0" y="244.0" text-anchor="middle">Flagship decision</text><text class="mono" x="750.0" y="278.0" text-anchor="middle">rare · highest leverage</text><text class="node-title" x="750.0" y="382.0" text-anchor="middle">Operating principles</text><text class="mono" x="750.0" y="414.0" text-anchor="middle">quarterly · durable</text><text class="node-title" x="750.0" y="532.0" text-anchor="middle">Reusable playbooks</text><text class="mono" x="750.0" y="564.0" text-anchor="middle">monthly · repeatable</text><text class="node-title" x="750.0" y="682.0" text-anchor="middle">Daily procedures</text><text class="mono" x="750.0" y="714.0" text-anchor="middle">daily · volume work</text></g><line class="axis" x1="90.0" y1="770" x2="90.0" y2="86" marker-end="url(#arrow)" data-role="leverage-axis" data-polygon-clearance="160.00"/><text class="kicker" x="54.0" y="430.0" text-anchor="middle" transform="rotate(-90 54 430)">RARER · HIGHER LEVERAGE</text><text class="kicker" x="1160.0" y="154.0" text-anchor="start">APEX</text><text class="mono" x="1160.0" y="188.0" text-anchor="start">defines direction</text><line class="legend-rule" x1="52" y1="882" x2="1368" y2="882"/><text class="kicker" x="56.0" y="920.0" text-anchor="start">LEGEND</text><rect class="legend-accent" x="210.0" y="902" width="28" height="24" rx="5"/><text class="legend-text" x="252.0" y="921.0" text-anchor="start">apex</text><line class="wire" x1="415.0" y1="916" x2="457.0" y2="916"/><text class="legend-text" x="473.0" y="921.0" text-anchor="start">supporting layer</text><text class="legend-note" x="1364.0" y="921.0" text-anchor="end">The base funds the apex; the apex defines the base.</text>
    </svg>